name: Bug report
description: Report a reproducible problem in Lightspeed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security problems here. Follow SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include config snippets, commands, URLs, or browser steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package or app
      placeholder: "@lightspeed/core, @lightspeed/config, apps/production, apps/playground"
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, browser, Node, pnpm"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
