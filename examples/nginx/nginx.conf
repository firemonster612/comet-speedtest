server {
  listen 80;
  server_name speedtest.example.com;

  root /usr/share/nginx/html;
  index index.html;

  location = /comet.config.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /speedtest/latency {
    add_header Cache-Control "no-store";
    # include /etc/nginx/snippets/comet-cors.conf;
    return 204;
  }

  location /speedtest/download/ {
    gzip off;
    # If ngx_brotli is installed and enabled globally, also set: brotli off;
    add_header Cache-Control "no-store";
    # include /etc/nginx/snippets/comet-cors.conf;
    sendfile on;
    tcp_nopush on;
    try_files $uri =404;
  }

  location = /speedtest/upload {
    # include /etc/nginx/snippets/comet-cors.conf;
    include /etc/nginx/snippets/comet-upload-discard.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 127.0.0.1:9080;
  server_name comet-upload-discard;
  access_log off;

  location = /_comet_upload_discard {
    return 204;
  }
}
